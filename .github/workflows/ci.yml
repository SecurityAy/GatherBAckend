name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

      - name: Build
        run: npm run build

      - name: Check whitespace
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Detect safe test database configuration
        id: test_db
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
        run: |
          if [ -n "$TEST_DATABASE_URL" ] && [ -n "$TEST_DIRECT_URL" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TEST_DATABASE_URL and TEST_DIRECT_URL secrets are not configured; integration tests will be skipped. Add both secrets pointing to the disposable gather_rsvp_test database to enable them."
          fi

      - name: Write safe test environment
        if: steps.test_db.outputs.available == 'true'
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
        run: printf 'DATABASE_URL=%s\nDIRECT_URL=%s\n' "$TEST_DATABASE_URL" "$TEST_DIRECT_URL" > .env.test.local

      - name: Integration tests (safe test database)
        if: steps.test_db.outputs.available == 'true'
        run: npm test
